name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python files
        run: |
          python -m py_compile app.py
          python -m py_compile src/profile_dataset.py
          python -m py_compile src/demand_forecasting.py
          python -m py_compile src/delivery_performance.py
          python -m py_compile src/capacity_planning.py
          python -m py_compile src/operational_intelligence.py

      - name: Build Docker image
        run: |
          docker build -t ecommerce-delivery-intelligence .